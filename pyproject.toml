[project]
name = "micropython-steami-sample"
version = "0.1.0"
description = "MicroPython sample scripts for the STeaMi board."

[dependency-groups]
# Lint tooling, installed with `pip install --group dev`.
# Keep the ruff pin in sync with .github/workflows/lint.yml.
dev = ["ruff==0.17.6"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501: long lines are acceptable in example code.
# F403/F405: most examples share their hardware setup through
# `from pins import *`, so star imports are intentional here.
ignore = ["E501", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
# These modules are star-imported by the examples: their "unused" imports
# are re-exported on purpose and must not be removed.
"**/pins.py" = ["F401"]
"demo/*.py" = ["F401"]
